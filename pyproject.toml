[project]
name = "videoscorerecon"
version = "0.1.0"
description = "从视频中检测、裁剪并拼接滚动乐谱"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "imagehash>=4.3.2",
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "requests>=2.32.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
