<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频乐谱提取器 - 设置</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 420px; margin: 40px auto; color: #18191c; }
    h1 { font-size: 18px; }
    h2 { font-size: 15px; margin-top: 24px; }
    label { display: block; margin-top: 14px; font-size: 13px; color: #61666d; }
    input, select { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; border: 1px solid #ccd0d6; border-radius: 6px; font-size: 13px; background: #fff; }
    button { margin-top: 18px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: #fb7299; color: #fff; font-size: 14px; cursor: pointer; }
    #status { margin-top: 12px; font-size: 13px; color: #00aeec; white-space: pre-wrap; }
    .hint { font-size: 12px; color: #9499a0; margin-top: 16px; line-height: 1.7; }
    code { background: #f1f2f3; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>🎼 视频乐谱提取器设置</h1>

  <div class="hint">
    <b>推荐用法（默认，零配置）</b>：<br>
    1. 打开任意 B 站视频页，点右下角「🎼 提取乐谱」<br>
    2. 时间范围默认已填全片（可改），点「开始提取」<br>
    3. 完成后本页预览、下载结果；想删改/排序/分页可点「✂️ 手动调整片段」——全程本机处理，不上传任何数据
  </div>

  <h2>视频画质（提取用）</h2>
  <label>默认 480P：无需登录可稳定获取，处理最快</label>
  <select id="quality">
    <option value="480">480P（默认，无需登录即可获取）</option>
    <option value="720">720P</option>
    <option value="1080">1080P</option>
    <option value="player">跟随播放器（嗅探优先，画质=正在观看的流）</option>
  </select>

  <h2>抽帧间隔（提取用）</h2>
  <label>秒数；越小抽得越密、耗时越长。留空 = 默认 2.5</label>
  <input id="interval" type="number" min="0.1" step="0.1" placeholder="2.5">

  <button id="save">保存</button>
  <div id="status"></div>

  <h2>下载失败时：授权全网访问（可选）</h2>
  <div class="hint">
    仅当视频下载全部失败（提示「所有下载源均失败」）才需要：授予后扩展可访问任意 CDN 域名，
    绕过跨域/混合内容限制。平时不需要，也不会弹窗。
  </div>
  <button id="grant" style="background:#00aeec">🔓 授权全网访问</button>
  <script src="options.js"></script>
</body>
</html>
