<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>片段微调 - 🎼 视频乐谱提取器</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="ed-head">
    <div class="ed-title">✂️ 片段微调 <span id="ed-count" class="ed-count"></span></div>
    <div class="ed-actions">
      <button id="ed-undo" disabled>撤销</button>
      <button id="ed-merge" class="ed-primary" disabled>重新合并</button>
      <button id="ed-close">关闭</button>
    </div>
  </header>

  <!-- 去重后保留片段：卡片横排，可删除/复制/上下移/撤销 -->
  <div id="ed-strip" class="ed-strip"></div>

  <div id="ed-status" class="ed-status">正在初始化…</div>

  <div id="ed-result" class="ed-result">
    <img id="ed-result-img" alt="合并结果">
    <div id="ed-downloads"></div>
  </div>

  <script src="editor.js"></script>
</body>
</html>
