<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>片段微调 - ScoreStitch</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="ed-head">
    <div class="ed-title"><img class="vsr-logo" src="icons/logo.png" alt="ScoreStitch">✂️ 片段微调 <span id="ed-count" class="ed-count"></span></div>
    <div class="ed-actions">
      <button id="ed-undo" disabled>撤销</button>
      <button id="ed-merge" class="ed-primary" disabled>重新合并</button>
      <button id="ed-close">关闭</button>
    </div>
  </header>

  <!-- 去重后保留片段：卡片横排，可删除/复制/上下移/撤销 -->
  <div id="ed-strip" class="ed-strip"></div>

  <div id="ed-status" class="ed-status">正在初始化…</div>

  <div id="ed-result" class="ed-result">
    <div class="ed-page-row">
      <label for="ed-page-size">每页片段数（留空或不小于片段总数 = 全部一页）</label>
      <input id="ed-page-size" type="number" min="1" step="1" placeholder="全部">
      <button id="ed-page-confirm" type="button">确认</button>
    </div>
    <div id="ed-result-body">
      <div class="ed-preview-label">首页预览：</div>
      <img id="ed-result-img" alt="合并结果">
      <div id="ed-downloads"></div>
    </div>
  </div>

  <script src="src/b64.js"></script>
  <script src="src/zip.js"></script>
  <script src="editor.js"></script>
</body>
</html>
